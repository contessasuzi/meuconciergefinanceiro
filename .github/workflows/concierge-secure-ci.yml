name: Concierge Secure CI

on:
  push:
    branches: [concierge-seguro-dev]
  pull_request:
    branches: [concierge-beta]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm test
